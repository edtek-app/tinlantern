name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      # CI runs the current milestone's gate; advance this as milestones
      # complete. gate-mN runs lint first, then the cumulative marked tests.
      - run: make gate-m1
